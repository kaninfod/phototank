<div class="col">
    <div class="card h-100 photo-tile" data-guid="{{ it.guid }}" data-gallery-target="photoTile">
        
    <div class="position-relative">
        <img class="thumb-img" loading="lazy" src="{{ it.thumb_url }}" alt="{{ it.guid }}">
        <button 
            data-gallery-target="ratePhoto" 
            data-action="click->gallery#changePhotoRating"
            type="button" 
            class="badge rounded-pill rating-badge position-absolute top-0 end-0 m-2 {% if (it.rating or 0) == 0 %}bg-secondary text-light{% else %}bg-warning text-dark{% endif %}" data-guid="{{ it.guid }}" data-rating="{{ it.rating or 0 }}">
                {{ it.rating or 0 }}
            </button>
        <div class="form-check position-absolute top-0 start-0 m-2 thumb-check">
        <input 
            data-gallery-target="selectPhoto"
            data-action="change->gallery#togglePhotoSelection"
            class="form-check-input select-photo" 
            type="checkbox" 
            data-guid="{{ it.guid }}" 
            aria-label="Select photo">
        </div>
        <a href="/phototank/photo/{{ it.guid }}?jump={{ jump_date }}{% if rating is not none %}&rating={{ rating }}{% endif %}{% if tag_id is not none %}&tag={{ tag_id }}{% endif %}{% if country %}&country={{ country|urlencode }}{% endif %}{% if city %}&city={{ city|urlencode }}{% endif %}&from={{ current|urlencode }}" class="stretched-link" aria-label="Open photo"></a>
    </div>
    <div class="card-body p-2">
        <div class="small text-muted text-truncate">{{ it.date|dt_min }}</div>
    </div>
    </div>
</div>
