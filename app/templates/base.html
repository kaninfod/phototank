<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "phototank" }}</title>
    <script type="importmap">
      {
        "imports": {
          "@hotwired/stimulus": "https://unpkg.com/@hotwired/stimulus/dist/stimulus.js"
        }
      }
    </script>


    <script type="module" src="{{ url_for('static', path='/js/main.js') }}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/phototank/static/css/site.css">
  </head>

  <body 
    class="d-flex flex-column vh-100"
    data-controller="appstate" 
    data-appstate-phototank-state-key-value="phototank_state_store"
    data-action="
      gallery:request-initial-state@window->appstate#sendStateRequest
      gallery:update-query-params-cursor@window->appstate#updateQueryParamsCursor"
    >
    <header  class="sticky-top">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <div class="d-flex align-items-center">
            <a class="navbar-brand me-2 phototank-dashboard-link" href="/phototank/dashboard" aria-label="Dashboard" title="Dashboard">&#9881;</a>
            <a class="navbar-brand" href="/phototank/">Phototank</a>
          </div>
          <div class="ms-auto">
            {% block nav_extra %}{% endblock %}
          </div>
        </div>
      </nav>
    </header>

    <main class="flex-grow-1 ">
      {% block content %}{% endblock %}
    </main>

    {% include "partials/toast_template.html" %}
    <div data-controller="toast">
        <div data-toast-target="container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
