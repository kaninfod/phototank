x-phototank-common: &phototank-common
  build: .
  image: phototank:local
  environment:
    # Required
    PHOTO_ROOT: /photos

    # Optional (these mirror the defaults in app/config.py)
    DB_PATH: data/phototank.sqlite
    DERIV_ROOT: data/derivatives
    IMPORT_ROOT: import
    FAILED_ROOT: failed

    # Logging
    LOG_LEVEL: INFO
    LOG_FILE: data/phototank.log

    # Optional backup settings
    # BACKUP_ENABLED: true
    # BACKUP_INTERVAL_HOURS: 24
    # BACKUP_RUN_TIME: "02:00"
    # BACKUP_HOST: backup-server.local
    # BACKUP_SSH_USER: backup-user
    # BACKUP_PORT: 22
    # BACKUP_SSH_KEY_PATH: /phototank/ssh/backup_id_ed25519
    # BACKUP_DEST_PATH: /backup/phototank

    # Examples:
    # PHOTO_EXTS: .jpg,.jpeg,.png,.heic,.webp
    # DATETIME_FALLBACK: json,mtime
  volumes:
    # Update these host paths for your environment.
    - /path/to/your/photos:/photos
    - ./data:/phototank/data
    - ./import:/phototank/import
    - ./failed:/phototank/failed
    # For remote backups, mount the SSH private key and known_hosts into the container.
    # - ./ssh:/phototank/ssh:ro
    # For local backups to a dedicated backup disk/share, mount it here.
    # - /path/to/your/backup:/backup
  restart: unless-stopped

services:
  phototank:
    <<: *phototank-common
    ports:
      # Change the left side (host port) to whatever you want.
      # You can also set PHOTOTANK_PORT in Portainer stack env.
      - "${PHOTOTANK_PORT:-8000}:8000"

  phototank-worker:
    <<: *phototank-common
    command: ["python", "-m", "app.worker"]
    # No ports exposed for the worker.
